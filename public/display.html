<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globo Photo Booth — Totem</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/display.css">
</head>
<body>
  <div class="display-page" id="app">
    <div class="grad-stripe top-stripe"></div>

    <!-- ═══ BOOTING ═══ -->
    <div class="state state-booting" id="state-booting">
      <div class="spinner"></div>
      <p class="booting-msg" id="booting-msg">Inicializando…</p>
      <p class="booting-sub" id="booting-sub">Detectando câmera</p>
    </div>

    <!-- ═══ PREVIEW ═══ -->
    <div class="state state-preview hidden" id="state-preview">
      <div class="preview-stage">
        <div class="stage-card" id="stage-card" data-ratio="4:5">

          <!-- WEBCAM mode -->
          <video id="camera-feed" autoplay playsinline muted></video>

          <!-- GPHOTO2 mode: MJPEG stream from server -->
          <img id="gphoto-feed" alt="Preview" class="hidden" />

          <!-- Frame overlay -->
          <img id="frame-overlay" alt="" />

          <!-- Mode badge -->
          <div class="mode-badge hidden" id="mode-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            <span id="mode-label">Sony A7III</span>
          </div>

          <!-- Text overlay -->
          <div class="preview-overlay-text" id="overlay-text">📸 Faça uma pose incrível!</div>

          <!-- Countdown -->
          <div class="countdown-overlay hidden" id="countdown-overlay">
            <span class="countdown-number" id="countdown-number">3</span>
          </div>

          <!-- Flash -->
          <div class="flash-overlay hidden" id="flash-overlay"></div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="bar-code-row">
          <span class="bar-label">Código</span>
          <span class="bar-value" id="session-code">------</span>
        </div>
        <div class="bar-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Aguardando controle</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="brand-text">Globo Photo Booth</span>
          <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Tela cheia"
            style="background:none;border:none;cursor:pointer;padding:4px;color:rgba(0,0,0,.35);display:flex;align-items:center;">
            <svg id="fs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ RESULT ═══ -->
    <div class="state state-result hidden" id="state-result">
      <div class="result-photo-panel">
        <img id="result-photo" alt="Sua foto" />
      </div>
      <div class="result-qr-panel">
        <h2 class="qr-title">Ficou incrível! 🎉</h2>
        <p class="qr-body">Escaneie para baixar no seu celular</p>
        <div class="qr-wrapper">
          <canvas id="qr-canvas"></canvas>
        </div>
        <p class="qr-count" id="photo-count"></p>
      </div>
      <div class="reset-bar"><div class="reset-bar-fill" id="reset-bar"></div></div>
    </div>

    <!-- ═══ ERROR ═══ -->
    <div class="state state-error hidden" id="state-error">
      <div class="error-content">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/><line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <h2>Câmera não encontrada</h2>
        <p>Verifique se a câmera está conectada e tente novamente.</p>
        <button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button>
      </div>
    </div>
  </div>

  <canvas id="capture-canvas" style="display:none"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fs-icon');
      if (document.fullscreenElement) {
        icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
      } else {
        icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
      }
    });
    document.addEventListener('click', function autoFS() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      document.removeEventListener('click', autoFS);
    }, { once: true });
  </script>
  <script src="/js/display.js"></script>
</body>
</html>
